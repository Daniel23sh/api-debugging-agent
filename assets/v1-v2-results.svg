<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Recorded V1 and V2 strict successes</title>
  <desc id="desc">Visualization of recorded results, not a screenshot. V1: 13 of 18 (72.2%). V2: 15 of 18 (83.3%). All 13 V1 strict successes retained. One run per case per version; not a statistical reliability estimate. Source: evaluation/reports/v1-v2-experiment-2026-10-21.md.</desc>
  <rect width="960" height="390" fill="#f8fafc" />
