  <text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" font-weight="400">18 frozen cases · one live run per case per version</text>
  <text x="40" y="148" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a" font-weight="700">V1</text>
  <rect x="112" y="119" width="576" height="44" rx="5" fill="#e2e8f0" />
