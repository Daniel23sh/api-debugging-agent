name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      EVAL_JUDGE_MODEL: ""
      PHOENIX_COLLECTOR_ENDPOINT: ""
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests (including Golden regression)
        run: python -m pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests (mocked network only)
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
