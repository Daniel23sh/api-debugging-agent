[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apilens"
version = "0.1.0"
description = "Evidence-driven API debugging agent with bounded tools and structured diagnoses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.17.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openinference-instrumentation>=0.1.65",
    "openinference-instrumentation-openai>=0.1.61",
    "openai>=3.19.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: deterministic offline system regression contracts"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true
# Keep imported types while reporting errors only in the explicit initial scope.
follow_imports = "silent"
files = [
    "agent_service/main.py",
    "agent_service/demo.py",
    "agent_service/agent/schemas.py",
    "agent_service/agent/state.py",
    "agent_service/tools/contracts.py",
    "agent_service/tools/endpoints.py",
    "sandbox_api/models.py",
    "sandbox_api/source_map.py",
    "evaluation/dataset.py",
]

[tool.setuptools.packages.find]
include = ["agent_service*", "evaluation*", "sandbox_api*"]
