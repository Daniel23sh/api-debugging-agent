[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apilens"
version = "0.1.0"
description = "Foundation for the APILens API Debugging Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.17.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openinference-instrumentation>=0.1.65",
    "openinference-instrumentation-openai>=0.1.61",
    "openai>=3.19.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.setuptools.packages.find]
include = ["agent_service*", "sandbox_api*"]
